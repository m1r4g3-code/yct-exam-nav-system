<svg class="dg" viewBox="0 0 680 352" role="img" aria-label="Hall best fit and seat numbering example">
  <style>
    svg.dg .bf-cap { fill: #f2f4f3; stroke: #cfd6d2; stroke-width: 1.2; }
    svg.dg .bf-fill { fill: #006633; }
    svg.dg .bf-fill2 { fill: #1f8a4c; }
    svg.dg text.bf-lab { font-size: 11.3px; fill: #ffffff; font-weight: 700; }
    svg.dg text.bf-h { font-size: 11.3px; font-weight: 700; fill: #17201b; }
    svg.dg text.bf-s { font-size: 11.3px; fill: #5d6b63; }
    svg.dg text.bf-hall { font-family: "Figtree", sans-serif; font-size: 11.3px; fill: #5d6b63; }
    svg.dg text.bf-seat { font-family: "Figtree", sans-serif; font-size: 11.3px; font-weight: 800; fill: #006633; }
  </style>
  <!-- Panel A -->
  <text x="1" y="13" class="tb" style="font-size:11.5px"><tspan fill="#006633">A</tspan>  Best fit inside one time slot</text>
  <text x="1" y="31" class="ts">Free halls A (200 seats), B (120), C (80) · classes of 110 and 70</text>

  <text x="0" y="58" class="bf-h">Hall A</text><text x="0" y="71" class="bf-s">200 seats</text>
  <rect x="58" y="46" width="220" height="26" rx="6" class="bf-cap"/>
  <text x="168" y="63" text-anchor="middle" class="bf-s" style="font-style:italic">free for a larger class</text>

  <text x="0" y="98" class="bf-h">Hall B</text><text x="0" y="111" class="bf-s">120 seats</text>
  <rect x="58" y="86" width="132" height="26" rx="6" class="bf-cap"/>
  <rect x="58" y="86" width="121" height="26" rx="6" class="bf-fill"/>
  <text x="66" y="103" class="bf-lab">COM112 · 110</text>
  <text x="198" y="103" class="bf-s">seats 1–110</text>

  <text x="0" y="138" class="bf-h">Hall C</text><text x="0" y="151" class="bf-s">80 seats</text>
  <rect x="58" y="126" width="88" height="26" rx="6" class="bf-cap"/>
  <rect x="58" y="126" width="77" height="26" rx="6" class="bf-fill2"/>
  <text x="66" y="143" class="bf-lab">COM311 · 70</text>
  <text x="154" y="143" class="bf-s">seats 1–70</text>

  <g style="font-size:11.3px">
    <circle cx="8" cy="176" r="8" fill="#f2b705"/><text x="8" y="180" text-anchor="middle" style="font-size:11.3px;font-weight:800;fill:#2b2200">1</text>
    <text x="22" y="180">Largest class first: COM112 (110) takes the</text>
    <text x="22" y="194">smallest hall that fits everyone — Hall B.</text>
    <circle cx="8" cy="212" r="8" fill="#f2b705"/><text x="8" y="216" text-anchor="middle" style="font-size:11.3px;font-weight:800;fill:#2b2200">2</text>
    <text x="22" y="216">COM311 (70) then takes Hall C, leaving</text>
    <text x="22" y="230">Hall A free. One course per hall per slot.</text>
  </g>

  <line x1="330" y1="4" x2="330" y2="236" stroke="#d9e3dd" stroke-dasharray="3 3"/>

  <!-- Panel B -->
  <text x="350" y="13" class="tb" style="font-size:11.5px"><tspan fill="#006633">B</tspan>  A class bigger than any single hall</text>
  <text x="350" y="31" class="ts">Same free halls · one class (COM111) of 260 students</text>

  <text x="350" y="58" class="bf-h">Hall A</text><text x="350" y="71" class="bf-s">200 seats</text>
  <rect x="408" y="46" width="220" height="26" rx="6" class="bf-fill"/>
  <text x="416" y="63" class="bf-lab">COM111 · first 200 · seats 1–200</text>

  <text x="350" y="98" class="bf-h">Hall B</text><text x="350" y="111" class="bf-s">120 seats</text>
  <rect x="408" y="86" width="132" height="26" rx="6" class="bf-cap"/>
  <text x="474" y="103" text-anchor="middle" class="bf-s" style="font-style:italic">free</text>

  <text x="350" y="138" class="bf-h">Hall C</text><text x="350" y="151" class="bf-s">80 seats</text>
  <rect x="408" y="126" width="88" height="26" rx="6" class="bf-cap"/>
  <rect x="408" y="126" width="66" height="26" rx="6" class="bf-fill"/>
  <text x="416" y="143" class="bf-lab">next 60</text>
  <text x="504" y="143" class="bf-s">seats 1–60</text>

  <g style="font-size:11.3px">
    <circle cx="358" cy="176" r="8" fill="#f2b705"/><text x="358" y="180" text-anchor="middle" style="font-size:11.3px;font-weight:800;fill:#2b2200">1</text>
    <text x="372" y="180">No hall seats 260, so the class fills the</text>
    <text x="372" y="194">largest free hall first — Hall A (200).</text>
    <circle cx="358" cy="212" r="8" fill="#f2b705"/><text x="358" y="216" text-anchor="middle" style="font-size:11.3px;font-weight:800;fill:#2b2200">2</text>
    <text x="372" y="216">The remaining 60 take the smallest hall that</text>
    <text x="372" y="230">fits them — Hall C. Hall B stays free.</text>
  </g>

  <!-- Panel C: seat numbering -->
  <rect x="0" y="250" width="680" height="102" rx="12" fill="#f4f9f6" stroke="#d9e3dd"/>
  <text x="14" y="270" class="tb" style="font-size:11.5px"><tspan fill="#006633">C</tspan>  Seat numbers — COM111 students sorted by matric number</text>
  <g>
    <rect x="14" y="282" width="118" height="46" rx="8" fill="#ffffff" stroke="#b9dbc6"/>
    <text x="22" y="298" class="mono" style="fill:#2b3530">F/ND/24/3210001</text><text x="22" y="316" class="bf-hall">Hall A ·</text><text x="62" y="316" class="bf-seat">Seat 1</text>
    <rect x="138" y="282" width="118" height="46" rx="8" fill="#ffffff" stroke="#b9dbc6"/>
    <text x="146" y="298" class="mono" style="fill:#2b3530">F/ND/24/3210002</text><text x="146" y="316" class="bf-hall">Hall A ·</text><text x="186" y="316" class="bf-seat">Seat 2</text>
    <text x="269" y="312" text-anchor="middle" style="font-size:16px;fill:#9aaca2">…</text>
    <rect x="282" y="282" width="118" height="46" rx="8" fill="#ffffff" stroke="#b9dbc6"/>
    <text x="290" y="298" class="mono" style="fill:#2b3530">F/ND/24/3210200</text><text x="290" y="316" class="bf-hall">Hall A ·</text><text x="330" y="316" class="bf-seat">Seat 200</text>
    <rect x="406" y="282" width="118" height="46" rx="8" fill="#ffffff" stroke="#e5c45c"/>
    <text x="414" y="298" class="mono" style="fill:#2b3530">F/ND/24/3210201</text><text x="414" y="316" class="bf-hall">Hall C ·</text><text x="454" y="316" class="bf-seat">Seat 1</text>
    <text x="537" y="312" text-anchor="middle" style="font-size:16px;fill:#9aaca2">…</text>
    <rect x="550" y="282" width="118" height="46" rx="8" fill="#ffffff" stroke="#e5c45c"/>
    <text x="558" y="298" class="mono" style="fill:#2b3530">F/ND/24/3210260</text><text x="558" y="316" class="bf-hall">Hall C ·</text><text x="598" y="316" class="bf-seat">Seat 60</text>
  </g>
  <text x="14" y="345" class="ts">Numbering restarts at 1 in every hall — so a seat number is always read together with its hall.</text>
</svg>
