<svg class="dg" viewBox="0 0 680 476" role="img" aria-label="Before and after comparison of the timetabling process">
  <!-- headers -->
  <rect x="0" y="0" width="326" height="40" rx="10" class="box-grey"/>
  <text x="16" y="25" class="tb" style="fill:#4b5852">BEFORE</text><text x="78" y="25" class="t" style="fill:#4b5852">— by hand, in a spreadsheet</text>
  <rect x="354" y="0" width="326" height="40" rx="10" class="box-gs"/>
  <text x="370" y="25" class="tb tw">AFTER</text><text x="420" y="25" class="t tw">— with YCT Exam Portal</text>

  <!-- left: manual steps -->
  <line x1="20" y1="60" x2="20" y2="384" stroke="#cfd6d2" stroke-width="2"/>
  <g>
    <rect x="0" y="56" width="326" height="38" rx="9" class="box-grey"/><circle cx="20" cy="75" r="11" fill="#8a968f"/><text x="20" y="79" text-anchor="middle" class="tw" style="font-size:11.3px;font-weight:800">1</text><text x="40" y="79" class="t" style="fill:#3d4842">Collect course lists for every level</text>
    <rect x="0" y="104" width="326" height="38" rx="9" class="box-grey"/><circle cx="20" cy="123" r="11" fill="#8a968f"/><text x="20" y="127" text-anchor="middle" class="tw" style="font-size:11.3px;font-weight:800">2</text><text x="40" y="127" class="t" style="fill:#3d4842">Check for clashes by eye, level by level</text>
    <rect x="0" y="152" width="326" height="38" rx="9" class="box-grey"/><circle cx="20" cy="171" r="11" fill="#8a968f"/><text x="20" y="175" text-anchor="middle" class="tw" style="font-size:11.3px;font-weight:800">3</text><text x="40" y="175" class="t" style="fill:#3d4842">Find out which halls are free, and when</text>
    <rect x="0" y="200" width="326" height="38" rx="9" class="box-grey"/><circle cx="20" cy="219" r="11" fill="#8a968f"/><text x="20" y="223" text-anchor="middle" class="tw" style="font-size:11.3px;font-weight:800">4</text><text x="40" y="223" class="t" style="fill:#3d4842">Guess whether each class will fit its hall</text>
    <rect x="0" y="248" width="326" height="38" rx="9" class="box-grey"/><circle cx="20" cy="267" r="11" fill="#8a968f"/><text x="20" y="271" text-anchor="middle" class="tw" style="font-size:11.3px;font-weight:800">5</text><text x="40" y="271" class="t" style="fill:#3d4842">Type seat lists for every paper</text>
    <rect x="0" y="296" width="326" height="38" rx="9" class="box-grey"/><circle cx="20" cy="315" r="11" fill="#8a968f"/><text x="20" y="319" text-anchor="middle" class="tw" style="font-size:11.3px;font-weight:800">6</text><text x="40" y="319" class="t" style="fill:#3d4842">Print lists and pin them on noticeboards</text>
    <rect x="0" y="344" width="326" height="38" rx="9" class="box-grey"/><circle cx="20" cy="363" r="11" fill="#8a968f"/><text x="20" y="367" text-anchor="middle" class="tw" style="font-size:11.3px;font-weight:800">7</text><text x="40" y="367" class="t" style="fill:#3d4842">Students crowd the board and hunt for halls</text>
  </g>

  <!-- right: automated flow -->
  <line x1="374" y1="64" x2="374" y2="372" stroke="#9cc7ad" stroke-width="2"/>
  <g>
    <rect x="354" y="56" width="326" height="52" rx="10" class="box-g"/><circle cx="374" cy="82" r="12" fill="#006633"/><text x="374" y="86" text-anchor="middle" class="tw" style="font-size:11.5px;font-weight:800">1</text>
    <text x="396" y="78" class="tb" style="font-size:12px">Structure, courses &amp; halls in the portal</text><text x="396" y="96" class="ts">kept up to date by the exams office</text>

    <rect x="354" y="120" width="326" height="52" rx="10" class="box-g"/><circle cx="374" cy="146" r="12" fill="#006633"/><text x="374" y="150" text-anchor="middle" class="tw" style="font-size:11.5px;font-weight:800">2</text>
    <text x="396" y="142" class="tb" style="font-size:12px">Students register and tick their courses</text><text x="396" y="160" class="ts">on their own phones, with their matric number</text>

    <rect x="354" y="184" width="326" height="70" rx="10" fill="#006633" stroke="#006633" stroke-width="1.5"/><circle cx="374" cy="210" r="12" fill="#f2b705"/><text x="374" y="214" text-anchor="middle" style="font-size:11.5px;font-weight:800;fill:#2b2200">3</text>
    <text x="396" y="206" class="tb tw" style="font-size:12.5px">One click: Generate</text><text x="396" y="224" class="ts" style="fill:#d3eadb">exam slots, a clash-free schedule, halls and</text><text x="396" y="240" class="ts" style="fill:#d3eadb">numbered seats — in seconds</text>

    <rect x="354" y="266" width="326" height="52" rx="10" class="box-g"/><circle cx="374" cy="292" r="12" fill="#006633"/><text x="374" y="296" text-anchor="middle" class="tw" style="font-size:11.5px;font-weight:800">4</text>
    <text x="396" y="288" class="tb" style="font-size:12px">Review the draft, then Publish All</text><text x="396" y="306" class="ts">department by department, adjusting if needed</text>

    <rect x="354" y="330" width="326" height="52" rx="10" class="box-g"/><circle cx="374" cy="356" r="12" fill="#006633"/><text x="374" y="360" text-anchor="middle" class="tw" style="font-size:11.5px;font-weight:800">5</text>
    <text x="396" y="352" class="tb" style="font-size:12px">Each student sees exam, hall and seat</text><text x="396" y="370" class="ts">with a live walking route to the hall</text>
  </g>

  <!-- outcomes -->
  <rect x="0" y="400" width="326" height="76" rx="10" fill="#f7f3ea" stroke="#e5d9bd" stroke-width="1.5"/>
  <text x="16" y="422" class="tb" style="font-size:11.5px;fill:#6b5a2e">TYPICAL RESULT</text>
  <text x="16" y="442" class="t" style="font-size:11.5px;fill:#3d4842">Days of work every semester · clashes can</text>
  <text x="16" y="460" class="t" style="font-size:11.5px;fill:#3d4842">slip through · halls can overflow · queues</text>
  <rect x="354" y="400" width="326" height="76" rx="10" fill="#e8f3ec" stroke="#006633" stroke-width="1.5"/>
  <text x="370" y="422" class="tb" style="font-size:11.5px;fill:#006633">RESULT</text>
  <text x="370" y="442" class="t" style="font-size:11.5px">Seconds to generate · clash-free by design</text>
  <text x="370" y="460" class="t" style="font-size:11.5px">hall capacity respected · personal timetables</text>
</svg>
